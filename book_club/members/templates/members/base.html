<!DOCTYPE html>
<html lang="en">
  {% block extra_head %}{% endblock %}
<head>
  <meta charset="utf-8">
  <title>{% block title %}Book Club{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'members:home' %}">Home</a> |
    <a href="{% url 'members:list' %}">Members</a>
  </nav>
  <hr>
  {% block content %}{% endblock %}
  <footer>
    <hr>
    <p>&copy; {% now "Y" %} Book Club</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
